name: OCPP Scenario Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ocpp-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install OCPP DebugKit CLI
        run: npm install -g @ocpp-debugkit/toolkit

      - name: Run scenario tests
        run: ocpp-debugkit ci --format json
